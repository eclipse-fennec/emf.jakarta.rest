import aQute.bnd.gradle.Export
import aQute.bnd.gradle.TestOSGi

plugins {
  id 'jacoco'
  id 'java'
  id 'org.geckoprojects.bnd.update'
}

// We need to define a repository for the root project, otherwise Jacoco dependencies cannot be resolved
repositories {
  mavenCentral()
  // Only for the SBOM exporter, which has no release yet (see sbomExporter below).
  maven {
    url = 'https://central.sonatype.com/repository/maven-snapshots/'
    mavenContent {
      snapshotsOnly()
      includeGroup 'org.geckoprojects.bnd'
    }
  }
}

// SBOM of the resolved application: `./gradlew sbom` writes a CycloneDX SBOM per bndrun to
// <project>/generated/sbom/ (options in the bndrun's -sbom instruction). The exporter is a bnd
// plugin (org.gecko.bnd.sbom); Gradle fetches it into cnf/cache/sbom-exporter/, and only then
// do the bndruns include it (cnf/sbom/plugin.bnd). The ordinary build never loads it.
configurations {
  sbomExporter {
    canBeConsumed = false
    transitive = false
  }
}
dependencies {
  // TODO switch to the first release once org.gecko.bnd.sbom is on Maven Central
  sbomExporter 'org.geckoprojects.bnd:org.gecko.bnd.sbom:0.1.0-SNAPSHOT'
}
def sbomExporter = tasks.register('sbomExporter', Sync) {
  description = 'Fetches the SBOM exporter into cnf/cache/sbom-exporter/, where the bndruns pick it up.'
  from configurations.sbomExporter
  into 'cnf/cache/sbom-exporter'
  rename { 'org.gecko.bnd.sbom.jar' }
}

def sbomBndruns = [
  'org.eclipse.fennec.rest.workspace.library': 'required.bndrun' // all bundles of the runtime
]
// Register only for the projects that are part of this build.
def sbomTasks = sbomBndruns.findResults { projectName, bndrunName ->
  def p = findProject(":${projectName}")
  p?.tasks?.register('sbom', Export) {
    description = "Writes the SBOM of ${bndrunName} (CycloneDX) to generated/sbom/."
    group = 'export'
    dependsOn sbomExporter
    bndrun = p.file(bndrunName)
    exporter = 'bnd.sbom'
    destinationDirectory = p.layout.projectDirectory.dir('generated/sbom')
  }
}
tasks.register('sbom') {
  description = 'Writes the SBOMs of the applications (see sbomBndruns).'
  group = 'export'
  dependsOn sbomTasks
}

// bnd update (org.gecko.bnd.update): reports only, nothing is changed.
//   ./gradlew bndUpdates                    newer versions in the .mvn indexes, within the policy
//   ./gradlew bndVulnerabilities -PbndUpdateTrivy=<trivy.json> -PbndUpdateSbom=<sbom.cdx.json>
//                                           for each library of the Trivy report of that SBOM:
//                                           the smallest fixing version within the policy
// Reports in build/bnd-update/. The policy is micro updates unless -PbndUpdateScope says
// otherwise. Findings never fail the build here; the gate is the Trivy step in sbom.yml.
bndUpdate {
  scope = providers.gradleProperty('bndUpdateScope').orElse('micro')
  format = providers.gradleProperty('bndUpdateFormat').orElse('markdown')
  failOnFindings = false
  if (providers.gradleProperty('bndUpdateTrivy').isPresent()) {
    trivyReport = file(providers.gradleProperty('bndUpdateTrivy').get())
  }
  if (providers.gradleProperty('bndUpdateSbom').isPresent()) {
    sbom = file(providers.gradleProperty('bndUpdateSbom').get())
  }
}

subprojects {

    // Apply plugin: 'jacoco' to all submodules; JUnit tests write generated/jacoco/test.exec
    apply plugin: 'jacoco'
    apply plugin: 'java'
    // We need to define a repository, otherwise Jacoco dependencies cannot be resolved
    repositories {
        mavenCentral()
    }
    // Allow gradle to enable JUnit support in submodules
    test {
        useJUnitPlatform()
    }

    // testOSGi must run tests. When the test bundle cannot be resolved (e.g. a
    // runbundle misses a capability), the bnd tester finds no test bundle and exits 0: the task
    // is green, no test ran, no report is written. bnd's -testunresolved only reports
    // unresolved bundles once tests run. So: no executed test in the reports = failure.
    tasks.withType(TestOSGi).configureEach {
        doLast {
            def reports = resultsDirectory.get().asFileTree.matching { include 'TEST-*.xml' }.files
            int tests = reports.sum(0) { report ->
                def m = report.text =~ /<testsuite\b[^>]*\btests="(\d+)"/
                m.find() ? (m.group(1) as int) : 0
            }
            if (tests == 0) {
                throw new GradleException("${path}: no OSGi test ran. Look for 'Failed to start bundle' "
                    + "above: the test bundle or one of its runbundles did not resolve.")
            }
        }
    }

    // Add JUnit dependencies for modules that have Gradle tests
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.14.4'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'
        testImplementation 'org.assertj:assertj-core:3.27.7'
    }
}
